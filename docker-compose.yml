services:
  app:
    image: ghcr.io/activepieces/activepieces:0.93.0
    container_name: arcturusflow-app
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - redis
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - AP_CONTAINER_TYPE=APP
      - AP_ENVIRONMENT=prod
      - AP_FRONTEND_URL=${AP_FRONTEND_URL:-http://localhost:8080}
      - AP_POSTGRES_DATABASE=${AP_POSTGRES_DATABASE:-activepieces}
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=${AP_POSTGRES_USERNAME:-postgres}
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD:-arcturusflow_pg_secret_pwd}
      - AP_REDIS_HOST=redis
      - AP_REDIS_PORT=6379
      - AP_JWT_SECRET=${AP_JWT_SECRET:-arcturusflow_jwt_secret_token_prod_key_1234567890}
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - AP_EXECUTION_MODE=UNSANDBOXED
      - AP_FLOW_TIMEOUT_SECONDS=600
      - AP_TELEMETRY_ENABLED=false
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - arcturusflow-net

  worker:
    image: ghcr.io/activepieces/activepieces:0.93.0
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - AP_CONTAINER_TYPE=WORKER
      - AP_ENVIRONMENT=prod
      - AP_FRONTEND_URL=${AP_FRONTEND_URL:-http://localhost:8080}
      - AP_POSTGRES_DATABASE=${AP_POSTGRES_DATABASE:-activepieces}
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=${AP_POSTGRES_USERNAME:-postgres}
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD:-arcturusflow_pg_secret_pwd}
      - AP_REDIS_HOST=redis
      - AP_REDIS_PORT=6379
      - AP_JWT_SECRET=${AP_JWT_SECRET:-arcturusflow_jwt_secret_token_prod_key_1234567890}
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - AP_EXECUTION_MODE=UNSANDBOXED
      - AP_FLOW_TIMEOUT_SECONDS=600
    deploy:
      replicas: 2
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - arcturusflow-net

  postgres:
    image: 'pgvector/pgvector:0.8.0-pg14'
    container_name: arcturusflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${AP_POSTGRES_DATABASE:-activepieces}
      - POSTGRES_USER=${AP_POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD:-arcturusflow_pg_secret_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arcturusflow-net

  redis:
    image: 'redis:7.0.7'
    container_name: arcturusflow-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - arcturusflow-net

volumes:
  postgres_data:
  redis_data:

networks:
  arcturusflow-net:
    driver: bridge
