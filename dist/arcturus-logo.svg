<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="arcturus-solar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="arcturus-gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="flow-circuit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.2" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="arcturus-radiance" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem: The Boötes Alpha Autonomous Flow Nucleus -->
  <g transform="translate(45, 20)">
    <!-- Orbital Flow Waves (Multi-Step Pipeline Circuits) -->
    <path d="M 10,80 Q 45,25 85,80 T 160,80" fill="none" stroke="url(#flow-circuit-grad)" stroke-width="3" stroke-dasharray="120 15" />
    <path d="M 20,95 Q 60,140 95,95 T 150,95" fill="none" stroke="url(#flow-circuit-grad)" stroke-width="2.5" stroke-dasharray="80 20" />

    <!-- Trigger Input Node -->
    <circle cx="20" cy="80" r="7" fill="#F59E0B" />
    <circle cx="20" cy="80" r="3.5" fill="#FFFFFF" />

    <!-- Action / LLM Transformer Node -->
    <circle cx="150" cy="95" r="7" fill="#EF4444" />
    <circle cx="150" cy="95" r="3.5" fill="#FFFFFF" />

    <!-- Autonomous Connector Beams -->
    <line x1="27" y1="80" x2="65" y2="80" stroke="#FBBF24" stroke-width="3" stroke-dasharray="4 3" />
    <line x1="105" y1="80" x2="143" y2="95" stroke="#F97316" stroke-width="3" stroke-dasharray="4 3" />

    <!-- Central Arcturus Star Engine (Boötes Alpha Giant) -->
    <g transform="translate(85, 80)" filter="url(#arcturus-radiance)">
      <!-- Outer Radiant Pulse Halo -->
      <polygon points="0,-48 12,-16 48,0 12,16 0,48 -12,16 -48,0 -12,-16" fill="url(#arcturus-solar-grad)" opacity="0.35" />
      
      <!-- Primary 8-Point Diamond Star -->
      <polygon points="0,-36 9,-12 36,0 9,12 0,36 -9,12 -36,0 -9,-12" fill="url(#arcturus-solar-grad)" />
      
      <!-- Inner Brilliant White Core -->
      <polygon points="0,-16 4,-5 16,0 4,5 0,16 -4,5 -16,0 -4,-5" fill="#FFFBEB" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Satellite Integration Nodes (400+ Pieces / Webhooks) -->
    <circle cx="50" cy="38" r="4.5" fill="#FBBF24" />
    <circle cx="120" cy="38" r="4" fill="#F97316" />
    <circle cx="60" cy="122" r="4.5" fill="#EF4444" />
    <circle cx="125" cy="126" r="3.5" fill="#F59E0B" />
  </g>

  <!-- Typography: ARCTURUS FLOW -->
  <g transform="translate(235, 105)">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="62" 
          letter-spacing="2" 
          fill="#0F172A">
      ARCTURUS<tspan fill="url(#arcturus-solar-grad)">FLOW</tspan>
    </text>

    <!-- Enterprise Positioning Subtitle -->
    <text y="38" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="600" 
          font-size="14.5" 
          letter-spacing="4.5" 
          fill="#D97706">
      AUTONOMOUS AI WORKFLOW &amp; AUTO-POSTING ENGINE
    </text>
  </g>
</svg>
